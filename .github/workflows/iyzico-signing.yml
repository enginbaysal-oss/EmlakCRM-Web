name: iyzico Signing Tests
on:
  push:
    branches: [feature/iyzico-guvenli-odeme-20261104]
    paths:
      - "supabase/functions/_shared/iyzico.ts"
      - "tests/iyzico-signing.test.ts"
      - "tests/iyzico-response.test.ts"
      - "tests/emlakcrm-payments-db.test.ts"
      - "supabase/functions/_shared/emlakcrm-payments.ts"
      - ".github/workflows/iyzico-signing.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "tests/iyzico-*.ts"
      - "tests/emlakcrm-payments-db.test.ts"
      - ".github/workflows/iyzico-signing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env=IYZICO_SECRET_KEY tests/iyzico-signing.test.ts tests/iyzico-response.test.ts tests/emlakcrm-payments-db.test.ts
      - name: Compile isolated payment functions
        run: deno check supabase/functions/emlakcrm-checkout-start/index.ts supabase/functions/emlakcrm-checkout-status/index.ts supabase/functions/emlakcrm-checkout-callback/index.ts
