name: Publish EmlakCRM Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare public website
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          token = os.environ.get("MAPBOX_PUBLIC_TOKEN", "")
          if not token.startswith("pk."):
              raise SystemExit("MAPBOX_PUBLIC_TOKEN must be a Mapbox public token beginning pk.")
          dest = Path("_site")
          dest.mkdir(exist_ok=True)
          for src in Path(".").glob("*.html"):
              content = src.read_text(encoding="utf-8")
              if src.name == "drone-cekim.html":
                  marker = 'const MAPBOX_PUBLIC_TOKEN="";'
                  if marker not in content:
                      raise SystemExit("Mapbox token placeholder missing")
                  content = content.replace(marker, 'const MAPBOX_PUBLIC_TOKEN="' + token + '";')
              (dest / src.name).write_text(content, encoding="utf-8")
          # Support previously installed PWAs with the pre-domain /EmlakCRM-Web/ start path.
          legacy = Path("legacy-mobile/EmlakCRM-Web/index.html")
          if legacy.is_file():
              legacy_dest = dest / "EmlakCRM-Web"
              legacy_dest.mkdir(parents=True, exist_ok=True)
              shutil.copy2(legacy, legacy_dest / "index.html")
          # Publish public PWA and client-side scripts used by mobile and backup features.
          # Keep the allowlist narrow: never publish private files or JSON backups.
          for pattern in ("*.js", "*.css", "*.webmanifest", "robots.txt", "sitemap.xml"):
              for src in Path(".").glob(pattern):
                  shutil.copy2(src, dest / src.name)
          # Publish static image assets used by legal and payment sections.
          assets = Path("assets")
          if assets.is_dir():
              shutil.copytree(assets, dest / "assets", dirs_exist_ok=True)
          cname = Path("CNAME")
          if cname.is_file():
              shutil.copy2(cname, dest / "CNAME")
          (dest / ".nojekyll").touch()
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub bazen yeni yüklenen paketi birkaç saniye geç görüyor; ilk deneme düşerse bekleyip tekrar dener.
      - id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying deploy
        if: steps.deployment_first.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        run: echo "page_url=${{ steps.deployment_first.outputs.page_url || steps.deployment_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
