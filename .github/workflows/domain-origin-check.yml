name: Verify EmlakCRM domain origin migration
on:
  push:
    branches:
      - feature/emlkcrm-domain-origin-compat-20261111
  pull_request:
    paths:
      - 'supabase/functions/_shared/emlakcrm-domain-origin.ts'
      - 'supabase/functions/emlakcrm-*/index.ts'
      - 'tests/emlakcrm-domain-origin.test.ts'
      - '.github/workflows/domain-origin-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test strict allowed origins
        run: deno test tests/emlakcrm-domain-origin.test.ts tests/emlakcrm-cloud-restore-preview.test.ts
      - name: Typecheck updated Edge Functions
        run: |
          deno check supabase/functions/emlakcrm-shopier-checkout/index.ts supabase/functions/emlakcrm-shopier-health/index.ts supabase/functions/emlakcrm-shopier-product/index.ts supabase/functions/emlakcrm-shopier-setup/index.ts supabase/functions/emlakcrm-shopier-coupon/index.ts supabase/functions/emlakcrm-checkout-start/index.ts supabase/functions/emlakcrm-checkout-status/index.ts
